services:
  traefik:
    image: docker.io/traefik:latest
    restart: always
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml
    networks:
      - bamboo_local_nw
    command:
      - --providers.docker
  api: &api
    build:
      context: .
      dockerfile: ./backend/docker/local/fastapi/Dockerfile
    volumes:
      - .:/src
      - ./backend/app/log:/src/backend/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./.envs/.env.local
    depends_on:
      - postgres
      - mailpit
      - redis
      - rabbitmq
      - mlflow
    command: /start.sh
    networks:
      - bamboo_local_nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8000"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.api-service.loadbalancer.healthcheck.timeout=5s"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    ports:
      - "4000:4000"
    volumes:
      - bamboo_mlflow_data:/mlflow
    env_file:
      - ./.envs/.env.local
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 4000 
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI} 
      --artifacts-destination ${MLFLOW_ARTIFACTS_DESTINATION} 
      --serve-artifacts 
    depends_on:
      - postgres
    networks:
      - bamboo_local_nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mlflow.entrypoints=web"
      - "traefik.http.routers.mlflow.rule=Host(`mlflow.localhost`)"
      - "traefik.http.routers.mlflow.service=mlflow-service"
      - "traefik.http.services.mlflow-service.loadbalancer.server.port=4000"
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - bamboo_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCPEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - bamboo_local_nw
  postgres:
    image: bamboo-postgres-local
    build:
      context: .
      dockerfile: ./backend/docker/local/postgres/Dockerfile
    ports:
      - "5433:5432"
    volumes:
      - bamboo_local_db:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    networks:
      - bamboo_local_nw

  redis:
    image: docker.io/redis:7.0-alpine
    command: redis-server --appendonly yes
    networks:
      - bamboo_local_nw
  
  rabbitmq:
    image: docker.io/rabbitmq:3.13-management
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - bamboo_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bamboo_local_nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.entrypoints=web"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.routers.rabbitmq.service=rabbitmq-service"
      - "traefik.http.services.rabbitmq-service.loadbalancer.server.port=15672"

  frontend:
    build:
      context: ./frontend/bamboo_banking
      dockerfile: docker/local/Dockerfile
    volumes:
      - ./frontend/bamboo_banking:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - api
    networks:
      - bamboo_local_nw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.rule=Host(`frontend.localhost`)"
      - "traefik.http.routers.frontend.service=frontend-service"
      - "traefik.http.services.frontend-service.loadbalancer.server.port=3000"


  celeryworker:
    <<: *api
    ports: []
    command: /start-celeryworker.sh

  flower:
    <<: *api
    ports:
      - "5555:5555"
    volumes:
      - bamboo_flower_data:/data
    command: /start-flower.sh
    depends_on:
      - redis
      - rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flower.entrypoints=web"
      - "traefik.http.routers.flower.rule=Host(`flower.localhost`)"
      - "traefik.http.routers.flower.service=flower-service"
      - "traefik.http.services.flower-service.loadbalancer.server.port=5555"
  
  celerybeat:
    <<: *api
    ports: []
    command: /start-celerybeat.sh
networks:
  bamboo_local_nw:
    external: true

volumes:
  bamboo_local_db:
  bamboo_mailpit_data:
  bamboo_flower_data:
  bamboo_rabbitmq_data:
  bamboo_mlflow_data:
